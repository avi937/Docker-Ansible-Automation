# ==============================================================================
# PROJECT 3: MULTI-TIER MICROSERVICES WITH DOCKER COMPOSE
# Architecture: Nginx (Reverse Proxy) -> Node.js API -> Redis (Private Cache)
# Security: Multi-Tier Network Isolation (Frontend Net vs Internal Backend Net)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # TIER 1: PUBLIC GATEWAY / REVERSE PROXY
  # ----------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: nginx-loadbalancer
    restart: unless-stopped
    ports:
      # The ONLY entrypoint exposed to the host machine / public internet
      - "80:80"
    volumes:
      # Inject custom reverse proxy routing configuration (Read-Only)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

  # ----------------------------------------------------------------------------
  # TIER 2: APPLICATION BUSINESS LOGIC (Node.js REST Microservice)
  # ----------------------------------------------------------------------------
  api-service:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: backend-microservice
    restart: unless-stopped
    environment:
      PORT: 3000
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
    # Notice: NO host ports exposed! Only accessible internally via Docker DNS
    networks:
      - frontend-net  # Allows Nginx to talk to API
      - backend-net   # Allows API to talk to Redis
    depends_on:
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M

  # ----------------------------------------------------------------------------
  # TIER 3: DATA PERSISTENCE & IN-MEMORY CACHE (Redis)
  # ----------------------------------------------------------------------------
  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    # Max memory limit + LRU eviction (Least Recently Used) policy
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    # Notice: Zero host ports exposed! Completely hidden from the internet
    volumes:
      - redis_data:/data
    networks:
      - backend-net   # Completely isolated! Nginx CANNOT reach this container
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 192M

# ==============================================================================
# NETWORKS: MULTI-TIER DEFENSE-IN-DEPTH ISOLATION
# ==============================================================================
networks:
  # Public-facing tier: Connects Nginx and API
  frontend-net:
    name: microservice_frontend_net
    driver: bridge

  # Private backend tier: Connects API and Redis ONLY (Isolated from Nginx)
  backend-net:
    name: microservice_backend_net
    driver: bridge

# ==============================================================================
# VOLUMES: PERSISTENT IN-MEMORY CACHE STORAGE
# ==============================================================================
volumes:
  redis_data:
    name: redis_cache_data
    driver: local
