events {
    # Maximum number of simultaneous connections per worker process
    worker_connections 1024;
}

http {
    # Do not show Nginx version in response headers (Security Best Practice)
    server_tokens off;

    # Upstream backend pool using Docker Embedded DNS service discovery
    upstream backend_microservice {
        # 'api-service' is the Docker Compose service name, resolved automatically by Docker DNS
        server api-service:3000;
        keepalive 32;
    }

    server {
        # Listen for HTTP traffic on standard port 80
        listen 80;
        server_name localhost;

        # 1. Nginx Liveness / Healthcheck Endpoint
        location /nginx-health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","service":"nginx-reverse-proxy"}\n';
        }

        # 2. Reverse Proxy all traffic to backend Node.js microservice
        location / {
            proxy_pass http://backend_microservice;
            
            # Use HTTP/1.1 for connection reuse (keepalive)
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward client identification headers to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Aggressive timeout thresholds to prevent slowloris/hung connections
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}
